<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>بوت اختبار الطلبات — DocBook</title>
<style>
  :root{ --teal:#0d9488; --teal-d:#115e59; --bg:#f1f5f9; --surface:#fff; --border:#e2e8f0; --muted:#64748b; --text:#0f172a; --ok:#16a34a; --err:#dc2626; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Tajawal',system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); padding:22px; line-height:1.5; }
  .wrap{ max-width:760px; margin:0 auto; }
  .warn{ background:#fef3c7; border:1px solid #f59e0b; color:#92400e; border-radius:12px; padding:11px 15px; font-size:.85rem; font-weight:700; margin-bottom:18px; }
  h1{ font-size:1.4rem; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:.85rem; margin:0 0 20px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin-bottom:16px; box-shadow:0 4px 18px -12px rgba(15,23,42,.2); }
  .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  label{ font-size:.85rem; font-weight:700; }
  input[type=number]{ width:84px; height:40px; border:1.5px solid var(--border); border-radius:10px; text-align:center; font-size:1rem; font-family:inherit; }
  button{ font-family:inherit; font-weight:800; border:none; border-radius:10px; cursor:pointer; padding:11px 20px; font-size:.9rem; transition:transform .1s, opacity .15s, background .15s; display:inline-flex; align-items:center; gap:8px; }
  button:active{ transform:scale(.97); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-teal{ background:var(--teal); color:#fff; }
  .btn-teal:hover{ background:var(--teal-d); }
  .btn-out{ background:#fff; color:var(--teal-d); border:1.5px solid var(--teal); }
  .btn-red{ background:#fee2e2; color:var(--err); border:1.5px solid #fca5a5; }
  .stats{ display:flex; gap:10px; }
  .stat{ flex:1; text-align:center; background:var(--bg); border-radius:12px; padding:12px; }
  .stat b{ display:block; font-size:1.6rem; }
  .stat.ok b{ color:var(--ok); } .stat.err b{ color:var(--err); } .stat.tot b{ color:var(--teal-d); }
  .stat span{ font-size:.75rem; color:var(--muted); font-weight:700; }
  #log{ max-height:340px; overflow-y:auto; font-size:.82rem; }
  .logrow{ display:flex; gap:8px; padding:8px 4px; border-bottom:1px dashed var(--border); align-items:baseline; }
  .logrow:last-child{ border-bottom:none; }
  .logrow .ic{ font-weight:900; }
  .logrow.ok .ic{ color:var(--ok); } .logrow.err .ic{ color:var(--err); }
  .logrow .nm{ font-weight:800; }
  .logrow .dt{ color:var(--muted); margin-inline-start:auto; font-variant-numeric:tabular-nums; }
  .toggle{ display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.85rem; }
  #err{ color:var(--err); font-weight:700; }
  .muted{ color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="warn">⚠️ أداة اختبار داخلية فقط — لا تنشرها مع صفحة الحجز. احذف هذا الملف قبل رفع النسخة للعميل.</div>
  <h1>🤖 بوت اختبار الطلبات</h1>
  <p class="sub">يرسل طلبات حجز عشوائية واقعية (مطابقة لصفحة الحجز) مباشرةً إلى الممرضة — لتجربة النظام بلا إدخال يدوي.</p>

  <div id="err"></div>

  <div class="card">
    <div class="row" style="margin-bottom:14px;">
      <label>عدد الطلبات</label>
      <input type="number" id="count" value="5" min="1" max="100">
      <label>ضمن الأيام القادمة</label>
      <input type="number" id="days" value="14" min="0" max="90">
      <button class="btn-teal" id="sendBtn">📨 أرسل الطلبات</button>
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="autoChk"> بوت مستمر (يرسل طلباً كل)</label>
      <input type="number" id="interval" value="4" min="1" max="120"><span class="muted">ثانية</span>
      <button class="btn-red" id="resetBtn" style="margin-inline-start:auto;">↺ صفّر العدّادات</button>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat tot"><b id="stTotal">0</b><span>إجمالي</span></div>
      <div class="stat ok"><b id="stOk">0</b><span>نجح</span></div>
      <div class="stat err"><b id="stErr">0</b><span>فشل</span></div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:8px;">
      <b>السجلّ</b><button class="btn-out" id="clearBtn" style="padding:6px 14px;font-size:.78rem;">مسح السجلّ</button>
    </div>
    <div id="log"><p class="muted">لا شيء بعد — اضغط «أرسل الطلبات».</p></div>
  </div>
</div>

<!-- إعدادات Firebase (نفس ملف صفحة الحجز) -->
<script src="config.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, doc, setDoc, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const errEl = document.getElementById('err');
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.projectId) {
    errEl.textContent = 'تعذّر تحميل config.js — افتح الصفحة من خلال خادم محلي (لا file://) وتأكّد أنها بجانب config.js.';
  }
  let db;
  try { db = getFirestore(initializeApp(cfg)); }
  catch (e) { errEl.textContent = 'فشل الاتصال بـFirebase: ' + e.message; }

  // بيانات عشوائية واقعية
  const FIRST = ['محمد','أحمد','عبد الله','كريم','بشار','بدر','أسامة','حسام','وليد','سامر','رامي','خالد','طارق','فادي','يوسف','آدم','تيم','جورج','إلياس','عمر','مازن','نضال','غيث','أنس',
                 'سارة','ريم','نور','هبة','مايا','جود','لينا','رنا','دانا','ميرا','سلمى','لين','رهف','ياسمين','آية','جنى','ملك','تالا'];
  const LAST  = ['الأحمد','الحلبي','الشامي','العلي','الخطيب','السيد','النجار','الحموي','الديري','القاضي','العمر','الحسن','الرفاعي','الزعبي','المصري','الدرويش'];
  const TYPES = ['كشف جديد','مراجعة','تحاليل'];
  const SLOTS = ['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00'];

  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const pad = n => String(n).padStart(2,'0');
  const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const slotLockId = (dateStr, time) => dateStr + '_' + String(time).replace(':','');

  function randomAppt(daysAhead) {
    const d = new Date(); d.setDate(d.getDate() + Math.floor(Math.random()*(daysAhead+1)));
    const by = 1955 + Math.floor(Math.random()*63);
    const bd = iso(new Date(by, Math.floor(Math.random()*12), 1 + Math.floor(Math.random()*28)));
    const name = rnd(FIRST) + (Math.random() < 0.6 ? ' ' + rnd(LAST) : '');
    return {
      id:          'appt_' + Date.now() + '_' + Math.random().toString(36).substr(2,6),
      PatientName: name,
      Phone:       '09' + String(Math.floor(Math.random()*1e8)).padStart(8,'0'),
      BirthDate:   bd,
      Address:     '',
      VisitType:   rnd(TYPES),
      Date:        iso(d),
      Slot:        rnd(SLOTS),
      Status:      'Pending',
      source:      'online',
      createdAt:   Date.now()
    };
  }

  async function sendOne(daysAhead) {
    let lastErr;
    for (let i = 0; i < 6; i++) {                       // إعادة محاولة عند تصادم الوقت المحجوز
      const appt = randomAppt(daysAhead);
      try {
        await setDoc(doc(db, 'bookedSlots', slotLockId(appt.Date, appt.Slot)),
          { date: appt.Date, time: appt.Slot, apptId: appt.id, status: 'booked', createdAt: serverTimestamp() });
        await addDoc(collection(db, 'appointments'), appt);
        try { new BroadcastChannel('clinicSync').postMessage({ key: 'appointments' }); } catch (e) {}
        return { ok: true, appt };
      } catch (e) { lastErr = e; }
    }
    return { ok: false, err: lastErr };
  }

  // عدّادات + سجلّ
  let total = 0, okC = 0, errC = 0;
  const $ = id => document.getElementById(id);
  function refresh(){ $('stTotal').textContent = total; $('stOk').textContent = okC; $('stErr').textContent = errC; }
  const logEl = $('log');
  function logAdd(res){
    if (logEl.querySelector('.muted')) logEl.innerHTML = '';
    const row = document.createElement('div');
    if (res.ok) {
      const a = res.appt;
      row.className = 'logrow ok';
      row.innerHTML = '<span class="ic">✓</span><span class="nm">'+a.PatientName+'</span><span>'+a.VisitType+'</span><span class="dt">'+a.Date+' • '+a.Slot+'</span>';
    } else {
      row.className = 'logrow err';
      row.innerHTML = '<span class="ic">✕</span><span class="nm">فشل الإرسال</span><span class="dt">'+((res.err&&res.err.code)||(res.err&&res.err.message)||'')+'</span>';
    }
    logEl.prepend(row);
  }

  async function burst(n, daysAhead, btn) {
    if (!db) return;
    if (btn) btn.disabled = true;
    for (let i = 0; i < n; i++) {
      const res = await sendOne(daysAhead);
      total++; res.ok ? okC++ : errC++;
      logAdd(res); refresh();
    }
    if (btn) btn.disabled = false;
  }

  $('sendBtn').onclick = () => burst(
    Math.max(1, +$('count').value || 1),
    Math.max(0, +$('days').value || 0),
    $('sendBtn')
  );

  // البوت المستمر
  let timer = null;
  $('autoChk').onchange = e => {
    if (e.target.checked) {
      const sec = Math.max(1, +$('interval').value || 4);
      timer = setInterval(() => burst(1, Math.max(0, +$('days').value || 0)), sec * 1000);
    } else if (timer) { clearInterval(timer); timer = null; }
  };

  $('resetBtn').onclick = () => { total = okC = errC = 0; refresh(); };
  $('clearBtn').onclick = () => { logEl.innerHTML = '<p class="muted">لا شيء بعد — اضغط «أرسل الطلبات».</p>'; };
</script>
</body>
</html>
